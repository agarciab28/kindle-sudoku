<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Library cover for Sudoku: one 3×3 box, drawn like the app (selected cell in black).
       Rendered to cover.png (see README); deploy.sh embeds it in the launcher. -->
  <rect width="600" height="900" fill="#fff"/>
  <rect x="9" y="9" width="582" height="882" fill="none" stroke="#000" stroke-width="18"/>
  <rect x="230" y="250" width="140" height="140" fill="#000"/>
  <g stroke="#000" stroke-width="5">
    <line x1="230" y1="110" x2="230" y2="530"/><line x1="370" y1="110" x2="370" y2="530"/>
    <line x1="90" y1="250" x2="510" y2="250"/><line x1="90" y1="390" x2="510" y2="390"/>
  </g>
  <rect x="90" y="110" width="420" height="420" fill="none" stroke="#000" stroke-width="14"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="100" text-anchor="middle">
    <text x="160" y="216">5</text>
    <text x="440" y="216">3</text>
    <text x="300" y="356" fill="#fff">7</text>
    <text x="160" y="496">1</text>
    <text x="440" y="496">9</text>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" text-anchor="middle">
    <text x="277" y="160">2</text><text x="323" y="160">4</text><text x="300" y="206">8</text>
  </g>
  <text x="300" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="112" text-anchor="middle">Sudoku</text>
  <rect x="250" y="738" width="100" height="6" fill="#000"/>
  <text x="300" y="800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" text-anchor="middle">Easy · Medium · Hard</text>
</svg>
